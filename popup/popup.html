<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CourseTracker AI</title>
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap" id="wrap">
    <header class="app-header">
      <div class="header-row">
        <div class="brand">
          <span class="crest">CT</span>
          <div class="brand-text">
            <h1 class="brand-title">CourseTracker</h1>
            <span class="brand-sub">Learning Portal</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="homeBtn" class="icon-btn" title="Open dashboard">⌂</button>
          <button id="themeBtn" class="icon-btn" title="Toggle theme">◐</button>
        </div>
      </div>
      <div class="accent-rule"></div>
    </header>

    <section class="card current-course">
      <div class="row between">
        <div>
          <div class="section-title">Current course</div>
          <div id="courseUrl" class="title">—</div>
        </div>
        <div class="pill outline" id="platformPill">—</div>
      </div>

      <div class="progress-block">
        <div class="row between small">
          <span id="progressLabel" class="muted">Progress: 0 / 0</span>
          <span id="progressPct" class="pct">0%</span>
        </div>
        <div class="track"><div id="progressFill" class="fill"></div></div>
        <div id="durationRow" class="duration" hidden>
          <span class="dur-icon">⏱</span>
          <span><strong id="durWatched">0m</strong> watched</span>
          <span class="dur-sep">·</span>
          <span><strong id="durRemaining">0m</strong> left</span>
          <span class="dur-sep">·</span>
          <span>of <strong id="durTotal">0m</strong></span>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row between">
        <label class="switch">
          <input type="checkbox" id="enabledToggle" />
          <span>Enable tracker</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="hiddenToggle" />
          <span>Hide sidebar</span>
        </label>
      </div>
      <div class="row gap">
        <button id="stopBtn" class="btn ghost">Stop</button>
        <button id="hideBtn" class="btn ghost">Hide</button>
        <button id="rescanBtn" class="btn">Rescan</button>
      </div>
    </section>

    <section class="card">
      <div class="row between">
        <span class="section-title">Lectures</span>
        <span id="lectureCount" class="muted small mono">0</span>
      </div>
      <ul id="lectureList" class="list"></ul>
    </section>

    <section class="card">
      <div class="row between">
        <span class="section-title">AI Playlist Builder</span>
        <button id="aiSettingsBtn" class="icon-btn" title="API key settings">⚙</button>
      </div>
      <textarea id="aiPrompt" class="input" rows="2"
        placeholder="e.g. all backend videos, beginner Python lessons, or 'add: intro, setup, routing'"></textarea>
      <div class="row gap">
        <button id="aiGenerateBtn" class="btn">Generate playlist</button>
        <span id="aiStatus" class="muted small"></span>
      </div>
      <div id="aiSettingsPanel" class="ai-settings" hidden>
        <label class="muted small">Groq API key (stored locally only)</label>
        <input id="aiKeyInput" class="input" type="password" placeholder="gsk_…" autocomplete="off" />
        <label class="muted small">Model</label>
        <select id="aiModelInput" class="input">
          <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile (default)</option>
          <option value="llama-3.1-8b-instant">llama-3.1-8b-instant (faster)</option>
          <option value="mixtral-8x7b-32768">mixtral-8x7b-32768</option>
          <option value="gemma2-9b-it">gemma2-9b-it</option>
        </select>
        <div class="row gap">
          <button id="aiKeySave" class="btn">Save</button>
          <button id="aiKeyClear" class="btn ghost">Clear</button>
        </div>
        <p class="muted small" style="margin: 4px 0 0">
          Get a free key at <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a>.
          The key never leaves your browser.
        </p>
      </div>
    </section>

    <section class="card">
      <div class="row between">
        <span class="section-title">My Playlists</span>
        <button id="newPlaylistBtn" class="btn">+ New</button>
      </div>
      <ul id="playlistList" class="list"></ul>
    </section>

    <div id="addToPlaylistPanel" class="modal" hidden>
      <div class="modal-inner">
        <header class="row between">
          <strong>Add to playlist</strong>
          <button id="addPanelClose" class="icon-btn">✕</button>
        </header>
        <div id="addPanelTitle" class="muted small"></div>
        <ul id="addPanelList" class="list"></ul>
        <div class="row gap">
          <input id="addPanelNewName" class="input" placeholder="New playlist name…" />
          <button id="addPanelCreate" class="btn">Create &amp; add</button>
        </div>
      </div>
    </div>

    <section class="card">
      <div class="row gap">
        <button id="exportBtn" class="btn ghost">Export JSON</button>
        <button id="importBtn" class="btn ghost">Import JSON</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
      <button id="resetBtn" class="btn danger">Reset this course</button>
    </section>

    <footer class="foot">
      CourseTracker AI · v1.5.0
    </footer>
  </div>

  <script src="../utils/storage.js"></script>
  <script src="../utils/progress.js"></script>
  <script src="popup.js"></script>
</body>
</html>
